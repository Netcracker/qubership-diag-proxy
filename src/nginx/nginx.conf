worker_processes auto;

# nginx writes its own error log in a fixed text layout. Open-source nginx cannot
# emit it as JSON, so only the destination and the severity are set here.
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;
worker_rlimit_nofile 8192;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # NDJSON access log. escape=json quotes every value and keeps the record on
    # one line. A log_format cannot drop a key at runtime, so there are two
    # variants: one with request_id and one without, selected by the maps below.
    log_format json_log escape=json
        '{"time":"$time_iso8601","level":"INFO",'
        '"message":"$request_method $request_uri -> $status",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":"$status","bytes_sent":"$bytes_sent",'
        '"request_time":"$request_time","upstream_addr":"$upstream_addr"}';

    log_format json_log_request_id escape=json
        '{"time":"$time_iso8601","level":"INFO",'
        '"message":"$request_method $request_uri -> $status",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":"$status","bytes_sent":"$bytes_sent",'
        '"request_time":"$request_time","upstream_addr":"$upstream_addr",'
        '"request_id":"$http_x_request_id"}';

    map $http_x_request_id $with_request_id {
        ""      0;
        default 1;
    }

    map $http_x_request_id $without_request_id {
        ""      1;
        default 0;
    }

    access_log /dev/stdout json_log            if=$without_request_id;
    access_log /dev/stdout json_log_request_id if=$with_request_id;

    include /etc/nginx/conf.d/http/*.conf;
}

stream {
    include /etc/nginx/conf.d/stream/*.conf;
}
