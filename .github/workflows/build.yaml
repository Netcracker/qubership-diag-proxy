name: Build Artifacts

on:
  release:
    types: [created]
  push:
    branches:
    - '**'
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - '*.md'
    - 'LICENSE'
  pull_request:
    branches:
    - '**'

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect image build changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      transfer: ${{ steps.filter.outputs.transfer }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Match changed files against the image build paths
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        proxy=false
        transfer=false
        while IFS= read -r path; do
          case "${path}" in
            .github/workflows/build.yaml|tools/verify-nginx.sh)
              proxy=true
              transfer=true
              ;;
            Dockerfile|src/*|charts/*)
              proxy=true
              ;;
            docker-transfer/*|docs/*)
              transfer=true
              ;;
          esac
        done < <(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")

        echo "proxy=${proxy}" >> "${GITHUB_OUTPUT}"
        echo "transfer=${transfer}" >> "${GITHUB_OUTPUT}"

  build-proxy:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.proxy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: .
        file: Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        provenance: false
        tags: diag-proxy:ci
    - name: Validate NGINX configuration
      run: ./tools/verify-nginx.sh diag-proxy:ci

  build-transfer:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.transfer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: .
        file: docker-transfer/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        provenance: false
        tags: diag-proxy-transfer:ci

  multiplatform_publish:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: diag-proxy
          file: Dockerfile
          context: .
        - name: diag-proxy-transfer
          file: docker-transfer/Dockerfile
          context: .
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.component.name }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64
        push: ${{ github.actor != 'dependabot[bot]' }}
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  docker-gate:
    name: Docker Gate
    needs: [changes, build-proxy, build-transfer]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require image and NGINX validation when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.proxy != 'false' && needs.build-proxy.result != 'success') ||
        (needs.changes.outputs.transfer != 'false' && needs.build-transfer.result != 'success')
      run: exit 1
