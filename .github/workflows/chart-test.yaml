name: Lint and Test Helm Charts

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'tools/verify-chart.sh'
      - '.github/workflows/chart-test.yaml'
  workflow_dispatch: null

concurrency:
  group: chart-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect chart changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed files against the chart paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            echo 'chart=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          chart=false
          while IFS= read -r file; do
            case "${file}" in
              charts/*|tools/verify-chart.sh|.github/workflows/chart-test.yaml)
                chart=true
                break
                ;;
            esac
          done < <(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "chart=${chart}" >> "${GITHUB_OUTPUT}"

  lint-test:
    needs: changes
    if: ${{ needs.changes.outputs.chart != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.0
      - name: Lint and verify rendered chart contracts
        run: ./tools/verify-chart.sh

  chart-gate:
    name: Chart Gate
    needs: [changes, lint-test]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require chart validation when applicable
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.chart != 'false' && needs.lint-test.result != 'success')
        run: exit 1
